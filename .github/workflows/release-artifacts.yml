name: Release artifacts

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release-artifacts.yml
      - .mise.toml
      - mise.lock
      - Gemfile
      - Gemfile.lock
      - valpo.gemspec
      - release.json
      - exe/**
      - db/migrations/**
      - docs/development.md
      - docs/valpo-release-lifecycle.md
      - docs/valpo-roadmap.md
      - packaging/README.md
      - packaging/release/**
      - packaging/upgrade/**
      - packaging/upgrade.sh
      - test/packaging/upgrade_script_test.rb
      - test/packaging/online_upgrade_test.rb
      - test/packaging/release_publication_test.rb
      - test/packaging/release_artifact_test.rb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    uses: ./.github/workflows/buildpack-acceptance.yml

  prepare:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby for release checks
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Verify tests, style, and documentation
        run: bundle exec rake test standard cli:docs:check api:check docs:check

      - name: Select release builds
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(jq --raw-output '.version' release.json)"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v${version}" ]]; then
            printf 'Tag %s does not match v%s\n' "$REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            matrix='{"include":[{"architecture":"amd64","runner":"ubuntu-26.04"}]}'
          else
            matrix='{"include":[{"architecture":"amd64","runner":"ubuntu-26.04"},{"architecture":"arm64","runner":"ubuntu-26.04-arm"}]}'
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "4.0.5"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install artifact utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build release artifact
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          VALPO_BUILDX_CACHE_FROM: type=gha,scope=valpo-release-${{ matrix.architecture }}
          VALPO_BUILDX_CACHE_TO: type=gha,mode=max,scope=valpo-release-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          arguments=(--architecture "$ARCHITECTURE" --output-dir dist)
          if [[ -n "$EXPECTED_TAG" ]]; then
            arguments+=(--expected-tag "$EXPECTED_TAG")
          fi
          packaging/release/build.sh "${arguments[@]}"

      - name: Smoke-test release artifact
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          packaging/release/smoke.sh \
            --architecture "$ARCHITECTURE" \
            --archive "dist/valpo-${VERSION}-linux-${ARCHITECTURE}.tar.zst"

      - name: Generate SBOM
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          packaging/release/sbom.sh \
            --architecture "$ARCHITECTURE" \
            --archive "dist/valpo-${VERSION}-linux-${ARCHITECTURE}.tar.zst" \
            --output "dist/valpo-${VERSION}-linux-${ARCHITECTURE}.spdx.json"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/valpo-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}.tar.zst

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/valpo-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}.tar.zst
          sbom-path: dist/valpo-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}.spdx.json

      - name: Collect attestation bundles
        if: github.event_name != 'pull_request'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          install -m 0644 "$PROVENANCE_BUNDLE" "dist/valpo-${VERSION}-linux-${ARCHITECTURE}.provenance.intoto.jsonl"
          install -m 0644 "$SBOM_BUNDLE" "dist/valpo-${VERSION}-linux-${ARCHITECTURE}.sbom.intoto.jsonl"

      - name: Generate pull request checksums
        if: github.event_name == 'pull_request'
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum > SHA256SUMS

      - name: Upload pull request output
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valpo-${{ needs.prepare.outputs.version }}-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload architecture transfer output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valpo-release-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    if: github.event_name != 'pull_request'
    needs: [prepare, build, acceptance]
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download architecture outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valpo-release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum > SHA256SUMS

      - name: Upload complete release output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valpo-${{ needs.prepare.outputs.version }}-release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash packaging/release/publish.sh "$RELEASE_TAG" dist

      - name: Delete transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          artifacts="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          mapfile -t transfer_ids < <(jq --raw-output \
            '.artifacts[] | select(.name | startswith("valpo-release-")) | .id' \
            <<<"$artifacts")
          for artifact_id in "${transfer_ids[@]}"; do
            curl --request DELETE --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done

  online-acceptance:
    if: github.ref_type == 'tag'
    needs: finalize
    uses: ./.github/workflows/buildpack-acceptance.yml
    with:
      online-release: true
