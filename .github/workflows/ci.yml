name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Test Caddy ACME issuance with Pebble
        run: bundle exec rake test:pebble

      - name: Check Ruby style
        run: bundle exec rake standard

      - name: Check generated and linked documentation
        run: bundle exec rake cli:docs:check api:check docs:check

      - name: Check shell syntax
        run: git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 shellcheck
