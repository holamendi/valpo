name: Buildpack installation acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare disposable runner for the supported Ubuntu package profile
        shell: bash
        run: |
          # The hosted runner is disposable. Remove conflicting vendor packages
          # here only; the Valpo installer never replaces an operator's backend.
          mapfile -t packages < <(dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' \
            | awk '$2 == "installed" && $1 ~ /^(docker-ce|docker-ce-cli|containerd.io|docker-buildx-plugin|docker-compose-plugin)$/ {print $1}')
          if ((${#packages[@]})); then
            sudo apt-get remove -y "${packages[@]}"
          fi
          sudo mkdir /tmp/valpo-acceptance-source
          sudo cp -a . /tmp/valpo-acceptance-source/
      - name: Install Valpo with all dependencies
        run: sudo bash /tmp/valpo-acceptance-source/packaging/install.sh
      - name: Exercise manifest, Ruby buildpacks, Postgres, and restart persistence
        shell: bash
        run: |
          cd /opt/valpo
          sudo -u valpo env HOME=/var/lib/valpo USER=valpo \
            XDG_CONFIG_HOME=/var/lib/valpo/.config XDG_DATA_HOME=/var/lib/valpo/.local/share XDG_CACHE_HOME=/var/lib/valpo/.cache \
            MISE_CONFIG_DIR=/var/lib/valpo/.config/mise MISE_DATA_DIR=/var/lib/valpo/.local/share/mise MISE_CACHE_DIR=/var/lib/valpo/.cache/mise \
            VALPO_ENV=production VALPO_CONFIG=/etc/valpo/valpo.yml VALPO_ACCEPTANCE=1 \
            PATH=/var/lib/valpo/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /var/lib/valpo/.local/bin/mise x ruby@4.0.5 -- \
            ruby -Ilib packaging/buildpack_acceptance.rb
      - name: Build a next-version artifact for upgrade acceptance
        shell: bash
        run: |
          sudo cp -a . /tmp/valpo-upgrade-candidate
          # Only the disposable candidate copy gets a synthetic next version.
          sudo /var/lib/valpo/.local/share/mise/installs/ruby/4.0.5/bin/ruby -rjson - /tmp/valpo-upgrade-candidate <<'RUBY'
          root = ARGV.fetch(0)
          metadata_path = File.join(root, "release.json")
          metadata = JSON.parse(File.read(metadata_path))
          previous = metadata.fetch("version")
          parts = previous.split("-").first.split(".").map(&:to_i)
          parts[2] += 1
          version = parts.join(".")
          metadata["version"] = version
          schema = metadata.fetch("schema_target") + 1
          metadata["schema_target"] = metadata["schema_max"] = schema
          migration = File.join(root, "db/migrations", "%03d_upgrade_acceptance.rb" % schema)
          File.write(migration, "Sequel.migration do\n  up do\n    create_table(:upgrade_acceptance) { String :value }\n    self[:upgrade_acceptance].insert(value: 'migration verified')\n  end\nend\n")
          File.write(metadata_path, JSON.pretty_generate(metadata) + "\n")
          path = File.join(root, "lib/valpo/version.rb")
          File.write(path, File.read(path).sub("VERSION = \"#{previous}\"", "VERSION = \"#{version}\""))
          path = File.join(root, "Gemfile.lock")
          File.write(path, File.read(path).gsub("valpo (#{Gem::Version.new(previous)})", "valpo (#{version})"))
          RUBY
          sudo env PATH=/var/lib/valpo/.local/share/mise/installs/ruby/4.0.5/bin:/usr/local/bin:/usr/bin:/bin \
            SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash /tmp/valpo-upgrade-candidate/packaging/release/build.sh \
            --architecture amd64 --output-dir /tmp/valpo-upgrade-artifacts
      - name: Exercise upgrade failure recovery and activation
        shell: bash
        run: |
          sudo env VALPO_UPGRADE_ACCEPTANCE=1 \
            bash /tmp/valpo-upgrade-candidate/packaging/upgrade/acceptance.sh \
            /tmp/valpo-upgrade-artifacts/valpo-*-linux-amd64.tar.zst
      - name: Verify the existing app and Postgres data after upgrading
        shell: bash
        run: |
          cd /opt/valpo/current
          sudo -u valpo env -i HOME=/var/lib/valpo USER=valpo \
            VALPO_ENV=production VALPO_CONFIG=/etc/valpo/valpo.yml VALPO_ACCEPTANCE=1 \
            BUNDLE_GEMFILE=/opt/valpo/current/Gemfile RUBYLIB=/opt/valpo/current/bundle \
            PATH=/opt/valpo/current/tools:/usr/local/bin:/usr/bin:/bin \
            /opt/valpo/current/runtime/ruby/bin/ruby -Ilib \
            /tmp/valpo-upgrade-candidate/packaging/buildpack_acceptance.rb verify
