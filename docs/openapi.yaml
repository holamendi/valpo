openapi: 3.1.0
info:
  title: Valpo API
  version: 0.1.0
  description: >-
    HTTP API for the pre-release Valpo server. Ruby dry-validation contracts are
    the runtime authority; this document is the maintained public mirror.
servers:
  - url: http://127.0.0.1:7092
security:
  - bearerAuth: []
paths:
  /:
    get:
      operationId: describeApi
      summary: Describe the API service
      responses:
        '200':
          description: API identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, version]
                properties:
                  service: {type: string}
                  version: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /health:
    get:
      operationId: getHealth
      summary: Report API process health
      responses:
        '200':
          description: Process health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, service, version, api_version, schema_version, schema_target, config_schema, host_profile, channel, artifact_digest]
                properties:
                  ok: {type: boolean}
                  service: {type: string}
                  version: {type: string}
                  api_version: {type: integer, minimum: 1}
                  schema_version: {type: integer, minimum: 0}
                  schema_target: {type: integer, minimum: 1}
                  config_schema: {type: integer, minimum: 1}
                  host_profile: {type: integer, minimum: 1}
                  channel: {type: string, enum: [development, preview, stable]}
                  artifact_digest:
                    type: [string, 'null']
                    pattern: '^sha256:[0-9a-f]{64}$'
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /integrations/github:
    get:
      operationId: describeGitHubIntegration
      summary: Describe the public GitHub integration
      security: []
      responses:
        '200':
          description: GitHub integration landing page
          content:
            text/html:
              schema: {type: string}
        '500': {$ref: '#/components/responses/InternalError'}
  /integrations/github/setup:
    get:
      operationId: showGitHubAppManifest
      summary: Render the GitHub App manifest form
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
      responses:
        '200':
          description: GitHub App manifest form
          content:
            text/html:
              schema: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /integrations/github/callback:
    get:
      operationId: completeGitHubAppSetup
      summary: Complete GitHub App setup
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
        - name: state
          in: query
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
      responses:
        '303':
          description: Redirect to GitHub App installation
          headers:
            Location:
              required: true
              schema: {type: string, format: uri}
          content:
            text/html:
              schema: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /integrations/github/installation:
    get:
      operationId: confirmGitHubAppInstallation
      summary: Confirm a GitHub App installation
      security: []
      parameters:
        - name: installation_id
          in: query
          required: true
          schema: {type: integer, minimum: 1}
        - name: setup_action
          in: query
          required: false
          schema: {type: string, enum: [install, update]}
      responses:
        '200':
          description: GitHub App installation confirmation
          content:
            text/html:
              schema: {type: string}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /integrations/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a signed GitHub webhook
      security: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: {$ref: '#/components/schemas/NonEmptyString'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted GitHub delivery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubWebhookResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401':
          description: Missing or invalid GitHub webhook HMAC signature
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/auth/github:
    get:
      operationId: getGitHubAuthentication
      summary: Show GitHub App authentication status
      responses:
        '200':
          description: GitHub authentication status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubAuthentication'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createGitHubAppSetup
      summary: Create a one-time GitHub App setup URL
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGitHubAppSetupRequest'}
      responses:
        '201':
          description: One-time GitHub App setup URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubAppSetup'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteGitHubAuthentication
      summary: Remove the local GitHub App credentials
      responses:
        '200':
          description: Removed local authentication state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubAuthenticationRemoval'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/auth/github/pat:
    post:
      operationId: storeGitHubPersonalAccessToken
      summary: Validate and store an encrypted fallback GitHub PAT
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreGitHubPersonalAccessTokenRequest'}
      responses:
        '201':
          description: GitHub PAT authentication status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitHubAuthentication'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/session:
    get:
      operationId: getCurrentAPICredential
      summary: Inspect the authenticated API credential
      description: Any valid credential scope may inspect its own metadata. No token or digest is returned.
      responses:
        '200':
          description: Current API credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/APICredential'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: revokeCurrentAPICredential
      summary: Revoke the authenticated API credential
      description: Any valid scope may revoke itself. The final active admin cannot be revoked.
      responses:
        '200':
          description: Revoked current API credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeAPICredentialResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/api-credentials:
    get:
      operationId: listAPICredentials
      summary: List API credentials
      responses:
        '200':
          description: API credentials
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/APICredential'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createAPICredential
      summary: Issue an API credential
      description: The first admin credential may be created without bearer authentication only by a loopback client. Successful bootstrap is permanent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPICredentialRequest'}
      responses:
        '201':
          description: Issued API credential; the token is returned only once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedAPICredential'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/api-credentials/{credential}:
    parameters:
      - {$ref: '#/components/parameters/APICredentialReference'}
    delete:
      operationId: revokeAPICredential
      summary: Revoke an API credential
      responses:
        '200':
          description: Revoked API credential
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeAPICredentialResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects:
    get:
      operationId: listProjects
      summary: List projects
      responses:
        '200': {$ref: '#/components/responses/ProjectList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201': {$ref: '#/components/responses/Project'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/apply:
    post:
      operationId: applyProjectManifest
      summary: Preview or enqueue a project manifest
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyProjectRequest'}
      responses:
        '200':
          description: Dry-run reconciliation plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManifestPlan'}
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/{project}:
    parameters:
      - {$ref: '#/components/parameters/ProjectReference'}
    get:
      operationId: getProject
      summary: Show a project
      responses:
        '200': {$ref: '#/components/responses/Project'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteProject
      summary: Enqueue deletion of an empty project
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/{project}/services:
    parameters:
      - {$ref: '#/components/parameters/ProjectReference'}
    get:
      operationId: listProjectServices
      summary: List a project's services
      responses:
        '200': {$ref: '#/components/responses/ServiceList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createService
      summary: Create a service in a project
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateServiceRequest'}
      responses:
        '201': {$ref: '#/components/responses/ServiceOperation'}
        '202': {$ref: '#/components/responses/ServiceOperation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/{project}/services/{service}:
    parameters:
      - {$ref: '#/components/parameters/ProjectReference'}
      - {$ref: '#/components/parameters/ServiceReference'}
    get:
      operationId: getProjectService
      summary: Show a service scoped to a project
      responses:
        '200': {$ref: '#/components/responses/Service'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/{project}/sources:
    parameters:
      - {$ref: '#/components/parameters/ProjectReference'}
    get:
      operationId: listProjectSources
      summary: List a project's sources
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Source'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/projects/{project}/logs:
    parameters:
      - {$ref: '#/components/parameters/ProjectReference'}
      - {$ref: '#/components/parameters/Tail'}
      - name: service
        in: query
        required: false
        schema: {$ref: '#/components/schemas/NonEmptyString'}
    get:
      operationId: getProjectLogs
      summary: Aggregate logs for a project
      responses:
        '200':
          description: Project log entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectLogs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      parameters:
        - name: project
          in: query
          required: false
          schema: {$ref: '#/components/schemas/NonEmptyString'}
      responses:
        '200': {$ref: '#/components/responses/ServiceList'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
    get:
      operationId: getService
      summary: Show a service
      responses:
        '200': {$ref: '#/components/responses/Service'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateService
      summary: Update application configuration
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateServiceRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteService
      summary: Enqueue forced service deletion
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: force
          in: query
          required: false
          schema: {type: boolean}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/logs:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/Tail'}
    get:
      operationId: getServiceLogs
      summary: Read service logs
      responses:
        '200':
          description: Service logs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceLogs'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/restart:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: restartService
      summary: Enqueue a service restart
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/stop:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: stopService
      summary: Enqueue a service stop
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/dependencies:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: bindServiceDependency
      summary: Bind a managed dependency
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindDependencyRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/dependencies/{dependency}:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/DependencyReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    delete:
      operationId: unbindServiceDependency
      summary: Unbind a managed dependency
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/deployments:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: deployService
      summary: Enqueue a registry or source deployment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeployServiceRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/releases:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
    get:
      operationId: listServiceReleases
      summary: List application releases
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Release'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/rollback:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: rollbackService
      summary: Enqueue rollback to the prior release
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/env:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
    get:
      operationId: getServiceEnvironment
      summary: Show generated service environment entries
      parameters:
        - name: reveal
          in: query
          required: false
          description: Reveal plaintext sensitive values. Requires an API credential with admin scope; other authenticated credentials receive 403 forbidden.
          schema: {type: boolean}
      responses:
        '200':
          description: Generated environment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceEnvironment'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/env/reconcile:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: reconcileServiceEnvironment
      summary: Apply the latest service environment revision
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/env/{name}:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/EnvironmentVariableName'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    put:
      operationId: setServiceEnvironmentVariable
      summary: Set a custom service environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetEnvironmentVariableRequest'}
      responses:
        '202':
          description: Stored environment variable and reconciliation job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentVariableOperation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: deleteServiceEnvironmentVariable
      summary: Remove a custom service environment variable
      responses:
        '202':
          description: Removed environment variable and reconciliation job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteEnvironmentVariableResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/domains:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
    get:
      operationId: listServiceDomains
      summary: List service domains
      responses:
        '200':
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Domain'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createServiceDomain
      summary: Create and verify a custom domain
      description: Creates the domain and its verification job atomically. The job payload includes domain_id. Repeating the request with the same Idempotency-Key returns the original job and domain.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDomainRequest'}
      responses:
        '202': {$ref: '#/components/responses/DomainOperation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/domains/{domain}/verify:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/DomainReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: verifyServiceDomain
      summary: Recheck a domain
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/services/{service}/domains/{domain}:
    parameters:
      - {$ref: '#/components/parameters/ServiceReference'}
      - {$ref: '#/components/parameters/DomainReference'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
    delete:
      operationId: deleteServiceDomain
      summary: Remove a custom domain
      responses:
        '200':
          description: Domain deletion and route-reconciliation job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeleteDomainResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/system/app-domain:
    get:
      operationId: getPlatformDomain
      summary: Show active and staged platform domains
      responses:
        '200': {$ref: '#/components/responses/PlatformDomainState'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: configurePlatformDomain
      summary: Stage and verify the platform app domain
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigureAppDomainRequest'}
      responses:
        '200': {$ref: '#/components/responses/PlatformDomainOperation'}
        '202': {$ref: '#/components/responses/PlatformDomainOperation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/system/repair:
    parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: repairSystem
      summary: Enqueue whole-system reconciliation
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/system/maintenance:
    parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: maintainStorage
      summary: Enqueue ownership-scoped storage maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MaintainStorageRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/system/secrets/verify:
    parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: verifySecrets
      summary: Enqueue encrypted-record recovery verification
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/system/secrets/rotate:
    parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
    post:
      operationId: rotateSecrets
      summary: Enqueue host-key rotation and bulk re-encryption
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs:
    get:
      operationId: listJobs
      summary: List jobs
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job}:
    parameters:
      - {$ref: '#/components/parameters/JobReference'}
    get:
      operationId: getJob
      summary: Show a job
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job}/events:
    parameters:
      - {$ref: '#/components/parameters/JobReference'}
    get:
      operationId: listJobEvents
      summary: List a job's events
      parameters:
        - name: after
          in: query
          required: false
          schema: {$ref: '#/components/schemas/NonEmptyString'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Job events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JobEvent'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job}/retry:
    parameters:
      - {$ref: '#/components/parameters/JobReference'}
    post:
      operationId: retryJob
      summary: Retry a failed retryable or resumable job
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/jobs/{job}/reconcile:
    parameters:
      - {$ref: '#/components/parameters/JobReference'}
    post:
      operationId: reconcileJob
      summary: Reconcile an interrupted compensating job
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    APICredentialReference:
      name: credential
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    ProjectReference:
      name: project
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    ServiceReference:
      name: service
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    DependencyReference:
      name: dependency
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    DomainReference:
      name: domain
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    JobReference:
      name: job
      in: path
      required: true
      schema: {$ref: '#/components/schemas/NonEmptyString'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Globally unique key for a mutating request that enqueues work.
      schema: {type: string, minLength: 1, maxLength: 255}
    EnvironmentVariableName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        maxLength: 128
    Tail:
      name: tail
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 10000, default: 200}
  responses:
    InvalidRequest:
      description: Malformed JSON or request-contract failure
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Bearer credential scope does not allow the operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource or route not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Current state conflicts with the requested operation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: Validly shaped request failed semantic validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Request body exceeds the supported size
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: Unexpected server failure with a generic client message
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Project:
      description: Project
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Project'}
    ProjectList:
      description: Projects
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Project'}
    Service:
      description: Service
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Service'}
    ServiceList:
      description: Services
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/Service'}
    Job:
      description: Background job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
    ServiceOperation:
      description: Created service and optional provisioning job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceOperation'}
    DomainOperation:
      description: Created domain and verification job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DomainOperation'}
    PlatformDomainState:
      description: Active and candidate platform domains
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformDomainState'}
    PlatformDomainOperation:
      description: Staged platform domain and optional verification job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformDomainOperation'}
  schemas:
    NonEmptyString:
      type: string
      pattern: '\S'
    Timestamp:
      type: [string, 'null']
      format: date-time
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_request, unauthorized, forbidden, not_found, conflict, validation_failed, payload_too_large, internal_error]
        message: {type: string}
        details:
          type: array
          items: {$ref: '#/components/schemas/ErrorDetail'}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/NonEmptyString'}
    ApplyProjectRequest:
      type: object
      additionalProperties: false
      required: [manifest]
      properties:
        manifest: {$ref: '#/components/schemas/NonEmptyString'}
        dry_run: {type: boolean}
    CreateGitHubAppSetupRequest:
      type: object
      additionalProperties: false
      properties:
        organization: {$ref: '#/components/schemas/NonEmptyString'}
    StoreGitHubPersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {$ref: '#/components/schemas/NonEmptyString'}
    GitHubAuthentication:
      type: object
      additionalProperties: false
      required: [authenticated, provider]
      properties:
        authenticated: {type: boolean}
        provider: {type: string, const: github}
        mode: {type: string, enum: [app, pat]}
        account: {type: string}
        app_id: {type: string}
        app_domain: {type: string}
        client_id: {type: string}
        owner: {type: string}
        slug: {type: string}
    GitHubAppSetup:
      type: object
      additionalProperties: false
      required: [expires_at, setup_url]
      properties:
        expires_at: {type: string, format: date-time}
        setup_url: {type: string, format: uri}
    GitHubAuthenticationRemoval:
      type: object
      additionalProperties: false
      required: [authenticated, provider, removed]
      properties:
        authenticated: {type: boolean, const: false}
        provider: {type: string, const: github}
        removed: {type: boolean}
    GitHubWebhookResult:
      type: object
      additionalProperties: false
      required: [duplicate, jobs]
      properties:
        duplicate: {type: boolean}
        jobs:
          type: array
          items: {type: string}
    CreateAPICredentialRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/NonEmptyString'}
        scopes:
          type: array
          items: {type: string, enum: [admin, read, write]}
    APICredential:
      type: object
      additionalProperties: false
      required: [id, name, token_prefix, scopes, last_used_at, expires_at, revoked_at, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        token_prefix: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [admin, read, write]}
        last_used_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    IssuedAPICredential:
      type: object
      additionalProperties: false
      required: [id, name, token_prefix, scopes, last_used_at, expires_at, revoked_at, created_at, updated_at, token]
      properties:
        id: {type: string}
        name: {type: string}
        token_prefix: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [admin, read, write]}
        last_used_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        token: {type: string, writeOnly: true}
    RevokeAPICredentialResult:
      type: object
      additionalProperties: false
      required: [revoked, credential]
      properties:
        revoked: {type: boolean, const: true}
        credential: {$ref: '#/components/schemas/APICredential'}
    SourceInput:
      type: object
      additionalProperties: false
      required: [provider, repository]
      properties:
        provider: {$ref: '#/components/schemas/NonEmptyString'}
        repository: {$ref: '#/components/schemas/NonEmptyString'}
        ref: {$ref: '#/components/schemas/NonEmptyString'}
    SourceChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        provider: {$ref: '#/components/schemas/NonEmptyString'}
        repository: {$ref: '#/components/schemas/NonEmptyString'}
        ref: {$ref: '#/components/schemas/NonEmptyString'}
    BuildInput:
      type: object
      additionalProperties: false
      properties:
        strategy: {type: string, enum: [auto, dockerfile, buildpack]}
        dockerfile: {$ref: '#/components/schemas/NonEmptyString'}
        context: {$ref: '#/components/schemas/NonEmptyString'}
        builder: {type: [string, 'null']}
        buildpacks:
          type: [array, 'null']
          minItems: 1
          uniqueItems: true
          items: {type: string}
    BuildChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        strategy: {type: string, enum: [auto, dockerfile, buildpack]}
        dockerfile: {$ref: '#/components/schemas/NonEmptyString'}
        context: {$ref: '#/components/schemas/NonEmptyString'}
        builder: {type: [string, 'null']}
        buildpacks:
          type: [array, 'null']
          minItems: 1
          uniqueItems: true
          items: {type: string}
    Command:
      type: array
      items: {$ref: '#/components/schemas/NonEmptyString'}
    Port:
      type: integer
      minimum: 1
      maximum: 65535
    NullablePort:
      anyOf:
        - {$ref: '#/components/schemas/Port'}
        - {type: 'null'}
    NullableHealthcheckPath:
      type: [string, 'null']
      pattern: '^/\S*$'
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: {$ref: '#/components/schemas/NonEmptyString'}
        type: {$ref: '#/components/schemas/NonEmptyString'}
        version: {$ref: '#/components/schemas/NonEmptyString'}
        command: {$ref: '#/components/schemas/Command'}
        internal_port: {$ref: '#/components/schemas/NullablePort'}
        healthcheck_path: {$ref: '#/components/schemas/NullableHealthcheckPath'}
        source: {$ref: '#/components/schemas/SourceInput'}
        build: {$ref: '#/components/schemas/BuildInput'}
        deploy: {type: boolean}
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      properties:
        source: {$ref: '#/components/schemas/SourceChanges'}
        build: {$ref: '#/components/schemas/BuildChanges'}
        command: {$ref: '#/components/schemas/Command'}
        internal_port: {$ref: '#/components/schemas/NullablePort'}
        healthcheck_path: {$ref: '#/components/schemas/NullableHealthcheckPath'}
        deploy: {type: boolean}
    DeployServiceRequest:
      type: object
      additionalProperties: false
      description: image and ref are mutually exclusive semantic options.
      properties:
        image: {$ref: '#/components/schemas/NonEmptyString'}
        ref: {$ref: '#/components/schemas/NonEmptyString'}
        internal_port: {$ref: '#/components/schemas/NullablePort'}
        healthcheck_path: {$ref: '#/components/schemas/NullableHealthcheckPath'}
    BindDependencyRequest:
      type: object
      additionalProperties: false
      required: [dependency_service_id]
      properties:
        dependency_service_id: {$ref: '#/components/schemas/NonEmptyString'}
    SetEnvironmentVariableRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, maxLength: 65536}
        sensitive: {type: boolean}
    CreateDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: {$ref: '#/components/schemas/NonEmptyString'}
    ConfigureAppDomainRequest:
      type: object
      additionalProperties: false
      required: [hostname]
      properties:
        hostname: {$ref: '#/components/schemas/NonEmptyString'}
    MaintainStorageRequest:
      type: object
      additionalProperties: false
      properties:
        dry_run: {type: boolean}
    Project:
      type: object
      additionalProperties: false
      required: [id, name, manifest_digest, last_applied_at, created_at, updated_at, service_count, source_count]
      properties:
        id: {type: string}
        name: {type: string}
        manifest_digest: {type: [string, 'null']}
        last_applied_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        service_count: {type: integer, minimum: 0}
        source_count: {type: integer, minimum: 0}
    Source:
      type: object
      additionalProperties: false
      required: [id, project_id, name, provider, repository, ref, auto_deploy, status, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        provider: {type: string}
        repository: {type: string}
        ref: {type: string}
        auto_deploy: {type: boolean}
        status: {type: string, enum: [unconnected, connected, failed]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    BuildTarget:
      type: object
      additionalProperties: false
      required: [id, project_id, source_id, name, strategy, dockerfile, context, builder, buildpacks, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        source_id: {type: string}
        name: {type: string}
        strategy: {type: string, enum: [auto, dockerfile, buildpack]}
        dockerfile: {type: [string, 'null']}
        context: {type: string}
        builder: {type: [string, 'null']}
        buildpacks:
          type: [array, 'null']
          items: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ServiceDependency:
      type: object
      additionalProperties: false
      required: [id, service_id, dependency_service_id, status, created_at, updated_at]
      properties:
        id: {type: string}
        service_id: {type: string}
        dependency_service_id: {type: string}
        status: {type: string, enum: [binding, active, deleting, failed]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    AppConfiguration:
      type: object
      additionalProperties: false
      required: [build_target_id, internal_port, healthcheck_path, command, port_mode, resolved_internal_port, source, build]
      properties:
        build_target_id: {type: [string, 'null']}
        internal_port: {anyOf: [{$ref: '#/components/schemas/Port'}, {type: 'null'}]}
        healthcheck_path: {type: [string, 'null']}
        command: {$ref: '#/components/schemas/Command'}
        port_mode: {type: string, enum: [automatic, explicit]}
        resolved_internal_port: {anyOf: [{$ref: '#/components/schemas/Port'}, {type: 'null'}]}
        source: {anyOf: [{$ref: '#/components/schemas/Source'}, {type: 'null'}]}
        build: {anyOf: [{$ref: '#/components/schemas/BuildTarget'}, {type: 'null'}]}
    ManagedConfiguration:
      type: object
      additionalProperties: false
      required: [version, image, container_name, volume_name, internal_host, internal_port]
      properties:
        version: {type: string}
        image: {type: string}
        container_name: {type: [string, 'null']}
        volume_name: {type: [string, 'null']}
        internal_host: {type: [string, 'null']}
        internal_port: {anyOf: [{$ref: '#/components/schemas/Port'}, {type: 'null'}]}
    Service:
      type: object
      additionalProperties: false
      required: [id, project_id, project, name, type, status, created_at, updated_at, dependencies]
      properties:
        id: {type: string}
        project_id: {type: string}
        project: {type: string}
        name: {type: string}
        type: {type: string, enum: [web, worker, postgres, redis]}
        status: {type: string, enum: [created, provisioning, ready, running, stopped, restarting, deleting, failed]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        app: {$ref: '#/components/schemas/AppConfiguration'}
        managed: {$ref: '#/components/schemas/ManagedConfiguration'}
        dependencies:
          type: array
          items: {$ref: '#/components/schemas/ServiceDependency'}
      oneOf:
        - required: [app]
        - required: [managed]
    Release:
      type: object
      additionalProperties: false
      required: [id, service_id, build_target_id, version, source_type, source_ref, artifact_ref, image_digest, artifact_available, build, status, internal_port, healthcheck_path, container_name, route_target, activated_at, created_at]
      properties:
        id: {type: string}
        service_id: {type: string}
        build_target_id: {type: [string, 'null']}
        version: {type: integer}
        source_type: {type: string}
        source_ref: {type: string}
        artifact_ref: {type: [string, 'null']}
        image_digest: {type: [string, 'null']}
        artifact_available: {type: boolean}
        build:
          anyOf:
            - {$ref: '#/components/schemas/ReleaseBuild'}
            - {type: 'null'}
        status: {type: string, enum: [pending, ready, active, inactive, failed]}
        internal_port: {anyOf: [{$ref: '#/components/schemas/Port'}, {type: 'null'}]}
        healthcheck_path: {type: [string, 'null']}
        container_name: {type: [string, 'null']}
        route_target: {type: [string, 'null']}
        activated_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ReleaseBuild:
      type: object
      additionalProperties: false
      required: [strategy]
      properties:
        strategy: {type: string, enum: [dockerfile, buildpack]}
        dockerfile: {type: string}
        builder: {type: string}
        run_image: {type: string}
        platform: {type: string}
        buildpacks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, version]
            properties:
              id: {type: string}
              version: {type: string}
        processes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, default]
            properties:
              type: {type: string}
              default: {type: boolean}
    Domain:
      type: object
      additionalProperties: false
      required: [id, service_id, platform_domain_id, hostname, kind, status, verification_error, verified_at, route_target, created_at, updated_at]
      properties:
        id: {type: string}
        service_id: {type: string}
        platform_domain_id: {type: [string, 'null']}
        hostname: {type: string, description: "Generated service domains use a stable unique service slug followed by the default domain; custom hostnames are unchanged."}
        kind: {type: string}
        status: {type: string, enum: [pending, verified, failed]}
        verification_error: {type: [string, 'null']}
        verified_at: {$ref: '#/components/schemas/Timestamp'}
        route_target: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    PlatformDomain:
      type: object
      additionalProperties: false
      required: [id, hostname, status, active, verification_error, verified_at, created_at, updated_at]
      properties:
        id: {type: string}
        hostname: {type: string}
        status: {type: string, enum: [pending, verified, failed]}
        active: {type: boolean}
        verification_error: {type: [string, 'null']}
        verified_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    Job:
      type: object
      additionalProperties: false
      required: [id, type, status, progress, error, project_id, project_name, service_id, related_service_id, idempotency_key, request_fingerprint, attempt, operation_generation, recovery_strategy, checkpoint, recovery_action, reconciliation_job_id, resolved_at, locked_by, locked_at, heartbeat_at, started_at, finished_at, created_at, payload]
      properties:
        id: {type: string}
        type: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        progress: {type: integer, minimum: 0, maximum: 100}
        error: {type: [string, 'null']}
        project_id: {type: [string, 'null']}
        project_name: {type: [string, 'null']}
        service_id: {type: [string, 'null']}
        related_service_id: {type: [string, 'null']}
        idempotency_key: {type: [string, 'null']}
        request_fingerprint: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        attempt: {type: integer, minimum: 0}
        operation_generation: {type: integer, minimum: 1}
        recovery_strategy: {type: string, enum: [retryable, resumable, compensating]}
        checkpoint: {type: [string, 'null']}
        recovery_action: {type: [string, 'null'], enum: [retry, reconcile, null]}
        reconciliation_job_id: {type: [string, 'null']}
        resolved_at: {$ref: '#/components/schemas/Timestamp'}
        locked_by: {type: [string, 'null']}
        locked_at: {$ref: '#/components/schemas/Timestamp'}
        heartbeat_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        payload: {type: object}
    JobEvent:
      type: object
      additionalProperties: false
      required: [id, job_id, stream, message, created_at]
      properties:
        id: {type: string}
        job_id: {type: string}
        stream: {type: string}
        message: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ServiceOperation:
      type: object
      additionalProperties: false
      required: [service, job]
      properties:
        service: {$ref: '#/components/schemas/Service'}
        job: {anyOf: [{$ref: '#/components/schemas/Job'}, {type: 'null'}]}
    DomainOperation:
      type: object
      additionalProperties: false
      required: [domain, job]
      properties:
        domain: {$ref: '#/components/schemas/Domain'}
        job: {$ref: '#/components/schemas/Job'}
    PlatformDomainState:
      type: object
      additionalProperties: false
      required: [active, candidate]
      properties:
        active: {anyOf: [{$ref: '#/components/schemas/PlatformDomain'}, {type: 'null'}]}
        candidate: {anyOf: [{$ref: '#/components/schemas/PlatformDomain'}, {type: 'null'}]}
    PlatformDomainOperation:
      type: object
      additionalProperties: false
      required: [app_domain, job]
      properties:
        app_domain: {$ref: '#/components/schemas/PlatformDomain'}
        job: {anyOf: [{$ref: '#/components/schemas/Job'}, {type: 'null'}]}
    ManifestAction:
      type: object
      additionalProperties: false
      required: [operation, type, name]
      properties:
        operation: {type: string, enum: [create, update, noop, retain]}
        type: {type: string}
        name: {type: string}
    ManifestPlan:
      type: object
      additionalProperties: false
      required: [project, digest, actions]
      properties:
        project: {type: string}
        digest: {type: string}
        actions:
          type: array
          items: {$ref: '#/components/schemas/ManifestAction'}
    LogOutput:
      type: object
      additionalProperties: false
      required: [stdout, stderr]
      properties:
        stdout: {type: string}
        stderr: {type: string}
    ServiceLogs:
      type: object
      additionalProperties: false
      required: [stdout, stderr, service]
      properties:
        stdout: {type: string}
        stderr: {type: string}
        service: {$ref: '#/components/schemas/Service'}
    ProjectLogEntry:
      type: object
      additionalProperties: false
      required: [service_id, service_name, type]
      properties:
        service_id: {type: string}
        service_name: {type: string}
        type: {type: string}
        stdout: {type: string}
        stderr: {type: string}
        error: {type: string}
      oneOf:
        - required: [stdout, stderr]
        - required: [error]
    ProjectLogs:
      type: object
      additionalProperties: false
      required: [project, logs]
      properties:
        project: {$ref: '#/components/schemas/Project'}
        logs:
          type: array
          items: {$ref: '#/components/schemas/ProjectLogEntry'}
    EnvironmentEntry:
      type: object
      additionalProperties: false
      required: [name, value, redacted, sensitive, origin, environment_variable_id, service_id, service_name, service_type, dependency_id]
      properties:
        name: {type: string}
        value: {type: string}
        redacted: {type: boolean}
        sensitive: {type: boolean}
        origin: {type: string, enum: [service, managed]}
        environment_variable_id: {type: [string, 'null']}
        service_id: {type: [string, 'null']}
        service_name: {type: [string, 'null']}
        service_type: {type: [string, 'null']}
        dependency_id: {type: [string, 'null']}
    ServiceEnvironmentVariable:
      type: object
      additionalProperties: false
      required: [id, service_id, name, sensitive, created_at, updated_at, value, redacted]
      properties:
        id: {type: string}
        service_id: {type: string}
        name: {type: string}
        sensitive: {type: boolean}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        value: {type: string}
        redacted: {type: boolean}
    ServiceEnvironment:
      type: object
      additionalProperties: false
      required: [service, env]
      properties:
        service: {$ref: '#/components/schemas/Service'}
        env:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentEntry'}
    EnvironmentVariableOperation:
      type: object
      additionalProperties: false
      required: [variable, job]
      properties:
        variable: {$ref: '#/components/schemas/ServiceEnvironmentVariable'}
        job: {$ref: '#/components/schemas/Job'}
    DeleteEnvironmentVariableResult:
      type: object
      additionalProperties: false
      required: [deleted, name, job]
      properties:
        deleted: {type: boolean, const: true}
        name: {type: string}
        job: {$ref: '#/components/schemas/Job'}
    DeleteDomainResult:
      type: object
      additionalProperties: false
      required: [deleted, job]
      properties:
        deleted: {type: boolean}
        job: {$ref: '#/components/schemas/Job'}
